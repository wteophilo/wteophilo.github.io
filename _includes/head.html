<!DOCTYPE html>
<html lang="pt-br" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <link rel="shortcut icon" href="{{ site.baseurl }}/assets/favicon.ico" type="image/x-icon">
    <link rel="icon" href="{{ site.baseurl }}/assets/favicon.ico" type="image/x-icon">
    <link href='{{ site.baseurl }}/feed.xml' rel='alternate' type='application/atom+xml'>
    <link rel="canonical" href="{{ site.baseurl }}{{ page.url }}">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/style.css">
    {% if page.layout == 'life-in-weeks' %}
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/life-in-weeks.css">
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background-color: #ffffff !important;
            --text-color: #000000 !important;
            --heading-color: #000000 !important;
            --font-main: 'Inter', sans-serif !important;
            --font-secondary: 'Inter', sans-serif !important;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --background-color: #ffffff !important;
                --text-color: #000000 !important;
                --heading-color: #000000 !important;
                --code-background-color: #f4f4f4 !important;
                --code-color: #000000 !important;
                --font-main: 'Inter', sans-serif !important;
                --font-secondary: 'Inter', sans-serif !important;
            }
        }
    </style>
</head>
